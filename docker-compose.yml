# ═══════════════════════════════════════════════════════════════════════════════
# EarlyBird — Docker Compose
# Autonomous AI Tech News Pipeline powered by Pi Agent
# Runs: EarlyBird Worker + PostgreSQL + Redis
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: earlybird
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-earlybird_dev_password}
      POSTGRES_DB: earlybird
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earlybird"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis (Job Queue + Caching)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # EarlyBird Autonomous Worker (X -> WeChat Official Account Pipeline)
  # ─────────────────────────────────────────────────────────────────────────────
  earlybird:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://earlybird:${POSTGRES_PASSWORD:-earlybird_dev_password}@postgres:5432/earlybird?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      X_COOKIES: ${X_COOKIES:-}
      EARLYBIRD_X_COOKIES_FILE: ${EARLYBIRD_X_COOKIES_FILE:-}
      EARLYBIRD_X_PROXY: ${EARLYBIRD_X_PROXY:-}
      EARLYBIRD_LLM_API_KEY: ${EARLYBIRD_LLM_API_KEY:-}
      EARLYBIRD_LLM_BASE_URL: ${EARLYBIRD_LLM_BASE_URL:-https://api.openai.com/v1}
      EARLYBIRD_LLM_MODEL: ${EARLYBIRD_LLM_MODEL:-gpt-4o-mini}
      EARLYBIRD_ARTICLE_MAX_TOKENS: ${EARLYBIRD_ARTICLE_MAX_TOKENS:-6000}
      EARLYBIRD_LLM_FALLBACK_API_KEY: ${EARLYBIRD_LLM_FALLBACK_API_KEY:-}
      EARLYBIRD_LLM_FALLBACK_BASE_URL: ${EARLYBIRD_LLM_FALLBACK_BASE_URL:-}
      EARLYBIRD_LLM_FALLBACK_MODEL: ${EARLYBIRD_LLM_FALLBACK_MODEL:-}
      EARLYBIRD_TAVILY_API_KEY: ${EARLYBIRD_TAVILY_API_KEY:-}
      EARLYBIRD_COVER_IMAGE_API_KEY: ${EARLYBIRD_COVER_IMAGE_API_KEY:-}
      EARLYBIRD_COVER_IMAGE_BASE_URL: ${EARLYBIRD_COVER_IMAGE_BASE_URL:-}
      EARLYBIRD_COVER_IMAGE_MODEL: ${EARLYBIRD_COVER_IMAGE_MODEL:-gemini-3.1-flash-image}
      EARLYBIRD_COVER_IMAGE_FALLBACK_API_KEY: ${EARLYBIRD_COVER_IMAGE_FALLBACK_API_KEY:-}
      EARLYBIRD_COVER_IMAGE_FALLBACK_BASE_URL: ${EARLYBIRD_COVER_IMAGE_FALLBACK_BASE_URL:-}
      EARLYBIRD_COVER_IMAGE_FALLBACK_MODEL: ${EARLYBIRD_COVER_IMAGE_FALLBACK_MODEL:-grok-imagine-image-2.0}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_AUTHOR: ${WECHAT_AUTHOR:-}
      EARLYBIRD_PUBLIC_MEDIA_URL: ${EARLYBIRD_PUBLIC_MEDIA_URL:-}
      EARLYBIRD_MEDIA_DIR: /app/data/earlybird/media
      EARLYBIRD_HOST_MEDIA_DIR: "${EARLYBIRD_HOST_MEDIA_DIR:-E:/Group-projects/EarlyBird-Pulse/XActions/data/earlybird/media}"
      EARLYBIRD_THREAD_WAIT_MS: ${EARLYBIRD_THREAD_WAIT_MS:-90000}
      EARLYBIRD_THREAD_TIMEOUT_MS: ${EARLYBIRD_THREAD_TIMEOUT_MS:-60000}
      EARLYBIRD_CONCURRENCY: ${EARLYBIRD_CONCURRENCY:-1}
      EARLYBIRD_EDITORIAL_BATCH_MINUTES: ${EARLYBIRD_EDITORIAL_BATCH_MINUTES:-30}
      EARLYBIRD_SOURCE_MIN_REQUEST_INTERVAL_MS: ${EARLYBIRD_SOURCE_MIN_REQUEST_INTERVAL_MS:-30000}
      EARLYBIRD_SOURCE_CONCURRENCY: ${EARLYBIRD_SOURCE_CONCURRENCY:-2}
      EARLYBIRD_X_REQUEST_TIMEOUT_MS: ${EARLYBIRD_X_REQUEST_TIMEOUT_MS:-12000}
      EARLYBIRD_SOURCE_POLL_TIMEOUT_MS: ${EARLYBIRD_SOURCE_POLL_TIMEOUT_MS:-30000}
      EARLYBIRD_STT_API_KEY: ${EARLYBIRD_STT_API_KEY:-}
      EARLYBIRD_STT_MODEL: ${EARLYBIRD_STT_MODEL:-gpt-4o-mini-transcribe}
      EARLYBIRD_HERMES_RELAY_URL: ${EARLYBIRD_HERMES_RELAY_URL:-http://host.docker.internal:8767/notify}
      EARLYBIRD_HERMES_RELAY_TOKEN_FILE: /run/secrets/earlybird-hermes-relay-token
      EARLYBIRD_HERMES_TIMEOUT_MS: ${EARLYBIRD_HERMES_TIMEOUT_MS:-45000}
      EARLYBIRD_DAILY_SUMMARY_CRON: ${EARLYBIRD_DAILY_SUMMARY_CRON:-0 21 * * *}
      EARLYBIRD_DAILY_EDITORIAL_REVIEW_CRON: ${EARLYBIRD_DAILY_EDITORIAL_REVIEW_CRON:-0 9,17 * * *}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_HEADLESS: "true"
      PUPPETEER_NO_SANDBOX: "true"
    volumes:
      - ./data/earlybird/media:/app/data/earlybird/media
      - ./data/earlybird/x.com_cookies.txt:/run/secrets/earlybird-x-cookies.txt:ro
      - ./data/earlybird/hermes-relay.token:/run/secrets/earlybird-hermes-relay-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "src/earlybird/worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
